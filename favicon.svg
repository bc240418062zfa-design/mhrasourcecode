<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="favBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- 3D Facet Left Wing -->
    <linearGradient id="favBlue" x1="12" y1="8" x2="32" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="50%" stop-color="#0052E0"/>
      <stop offset="100%" stop-color="#0035A0"/>
    </linearGradient>

    <!-- 3D Facet Right Wing -->
    <linearGradient id="favNavy" x1="52" y1="8" x2="32" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B357A"/>
      <stop offset="60%" stop-color="#061E47"/>
      <stop offset="100%" stop-color="#020C1F"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#favBg)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="#0066FF" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- MIHORA Real Geometric M Logo Structure -->
  <g transform="translate(6, 4) scale(0.13)">
    <!-- Left Wing -->
    <polygon points="60,20 200,180 150,225 20,70" fill="url(#favBlue)" />
    <polygon points="20,70 60,20 60,240 20,200" fill="#061A3C" />
    <polygon points="150,225 200,180 200,248 150,225" fill="#003794" />

    <!-- Right Wing -->
    <polygon points="340,20 200,180 250,225 380,70" fill="url(#favNavy)" />
    <polygon points="380,70 340,20 340,240 380,200" fill="#020C1F" />
    <polygon points="250,225 200,180 200,248 250,225" fill="#020917" />

    <!-- Constellation Net -->
    <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <line x1="50" y1="125" x2="85" y2="108" opacity="0.9" />
      <line x1="85" y1="108" x2="135" y2="145" opacity="0.9" />
      <line x1="135" y1="145" x2="175" y2="190" opacity="0.95" />
      <line x1="175" y1="190" x2="200" y2="148" opacity="0.95" />
      <line x1="200" y1="148" x2="265" y2="108" opacity="0.95" />
      <line x1="265" y1="108" x2="350" y2="125" opacity="0.9" />
      <line x1="175" y1="190" x2="285" y2="185" opacity="0.9" />
      <line x1="200" y1="148" x2="285" y2="185" opacity="0.9" />

      <circle cx="50" cy="125" r="9" fill="#FFFFFF" />
      <circle cx="85" cy="108" r="10" fill="#FFFFFF" />
      <circle cx="135" cy="145" r="10" fill="#FFFFFF" />
      <circle cx="175" cy="190" r="12" fill="#00D2FF" />
      <circle cx="200" cy="148" r="11" fill="#FFFFFF" />
      <circle cx="265" cy="108" r="12" fill="#00D2FF" />
      <circle cx="285" cy="185" r="10" fill="#FFFFFF" />
      <circle cx="350" cy="125" r="9" fill="#FFFFFF" />
    </g>
  </g>
</svg>
